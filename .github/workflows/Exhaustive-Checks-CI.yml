name: Exhaustive checks

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [labeled, unlabeled, synchronize]
    branches:
      - main

# For a PR #7488 against main branch, the `group` will become: CI-{{ 7488 || github.sha }}
# which eventually evaluates to: CI-7488 and 'sha' isn't used.
# NOTE: `||` acts as a logical OR and a default operator both,
# see: https://docs.github.com/en/actions/learn-github-actions/expressions#operators.
# When it isn't a PR against main but instead a commit pushed (or merged) to main, then `group` will
# evaluate to `${{ github.sha }}` but "cancel-in-progress" evaluates to false, so the CI on main
# will run in a new group `${{ github.sha }}`, but no previous CI will be cancelled on main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  MACOSX_DEPLOYMENT_TARGET: 15.0

jobs:
  debug_outOfSource:
    name: Check Out-of-Source Debug build
    runs-on: ubuntu-latest
    # Run on push to main, or when the PR has the label at the time of the event
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'Tests::Run-Exhaustive') && (github.event.action == 'synchronize' || github.event.label.name == 'Tests::Run-Exhaustive')) }}
    steps:
      - run: |
          echo "========================================"
          echo "JOB FIRED: ${{ github.job }}"
          echo "========================================"
          echo "Event name       : ${{ github.event_name }}"
          echo "Event action     : ${{ github.event.action }}"
          echo "Label just applied: ${{ github.event.label.name }}"
          echo "All PR labels    : ${{ join(github.event.pull_request.labels.*.name, ', ') }}"
          echo "PR number        : ${{ github.event.pull_request.number }}"
          echo "Triggered by     : ${{ github.actor }}"
          echo "Ref              : ${{ github.ref }}"

  release:
    name: Check Release build
    runs-on: ubuntu-latest
    # Run on push to main, or only when the specific label is modified on a PR
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'Tests::Run-Exhaustive') && (github.event.action == 'synchronize' || github.event.label.name == 'Tests::Run-Exhaustive')) }}
    steps:
      - run: |
          echo "========================================"
          echo "JOB FIRED: ${{ github.job }}"
          echo "========================================"
          echo "Event name       : ${{ github.event_name }}"
          echo "Event action     : ${{ github.event.action }}"
          echo "Label just applied: ${{ github.event.label.name }}"
          echo "All PR labels    : ${{ join(github.event.pull_request.labels.*.name, ', ') }}"
          echo "PR number        : ${{ github.event.pull_request.number }}"
          echo "Triggered by     : ${{ github.actor }}"
          echo "Ref              : ${{ github.ref }}"

